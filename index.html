<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AC6 trainer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
      #game { display: block; width: 100%; height: 100%; }
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
        color: #8fa; font: 14px/1.7 ui-monospace, monospace; white-space: pre-wrap;
        text-align: center; padding: 24px; box-sizing: border-box;
      }
      #boot[data-test-boot] { background: #0b0d10; font-family: 'Yu Gothic UI', 'Segoe UI', sans-serif; }
      #boot .boot-msg { font-size: 20px; color: #e8eef2; }
      #boot .boot-sub { font-size: 16px; color: #9fb0bd; margin-top: 4px; }
      #boot .boot-reload {
        margin-top: 24px; padding: 8px 28px; font: inherit; font-size: 16px;
        color: #0b0d10; background: #8fa; border: 0; border-radius: 4px; cursor: pointer;
      }
      #boot .boot-detail {
        margin-top: 32px; max-width: 880px; font: 12px/1.5 ui-monospace, monospace;
        color: #7b8a96; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere;
        user-select: text; -webkit-user-select: text;
      }
      #boot[data-blocked], #boot:has(noscript) { font-family: 'Yu Gothic UI', 'Segoe UI', sans-serif; font-size: 18px; color: #e8eef2; }
    </style>
    <script type="module" crossorigin src="./assets/index-8iOz0ihR.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot"><noscript>このページを表示するには JavaScript を有効にしてください。</noscript></div>
    <script>
      (function () {
        var b = document.getElementById('boot'), m = '', k = '';
        if (location.protocol === 'file:') {
          k = 'file'; m = 'ファイルを直接開いた状態では動作しません。公開ページの URL から開いてください。';
        } else {
          var c = document.createElement('canvas'), g = null;
          try { g = c.getContext('webgl2'); } catch (e) { g = null; }
          if (g && g.getExtension('WEBGL_lose_context')) g.getExtension('WEBGL_lose_context').loseContext();
          if (!g) {
            k = 'webgl';
            m = 'お使いの環境では WebGL 2 を利用できないため、起動できません。ブラウザの設定でハードウェアアクセラレーションが有効になっているかご確認ください。';
          }
        }
        if (k) { b.setAttribute('data-blocked', k); b.textContent = m; }
      })();
    </script>
    <script nomodule>document.getElementById('boot').textContent = 'お使いのブラウザには対応していません。最新版のブラウザでお試しください。';</script>
  </body>
</html>
